[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name is provisional; see docs/design.md §22 (name conflict on PyPI).
name = "xinfer"
version = "0.0.1.dev0"
description = "Inference serving for vision-language-action models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.4",
    "safetensors>=0.4",
]

[project.optional-dependencies]
# Optional model input processing for Wall-X 2B on RPU: exact Transformers/Torchvision versions used by the CPU
# processing reference and the frozen request adapter (see docs/models/wallx2b_rpu.md).
wallx2b = [
    "transformers==5.2.0",
    "torchvision>=0.25",
    "pyyaml>=6",
    "pillow>=10",
]
# Tokenization, image processing, and pose conversion for Wall-OSS and Wall-X 2B.
models = [
    "tokenizers>=0.19",
    "opencv-python-headless>=4.10",
    "pyyaml>=6",
    "numba>=0.60",
    "pillow>=10",
]
# image_preprocess_device = "gpu": JPEG decoding with nvJPEG (batched CUDA decode_jpeg).
gpu-image = [
    "torchvision>=0.19",
]
serve = [
    "websockets>=12",
    "msgpack>=1.0",
    "msgpack-numpy>=0.4.8",
    "prometheus_client>=0.20",
]
test = [
    "pytest>=7",
    "websockets>=12",
    # The RPU host tests compare banded cameras against Torchvision on CPU.
    "torchvision>=0.25",
    "prometheus_client>=0.20",
    "msgpack>=1.0",
    "msgpack-numpy>=0.4.8",
    "tokenizers>=0.19",
    "opencv-python-headless>=4.10",
    "pyyaml>=6",
    "numba>=0.60",
    "pillow>=10",
]

[project.scripts]
xinfer-serve = "xinfer.entrypoints.serve:main"
xinfer-wallx2b-openloop = "xinfer.entrypoints.wallx2b_openloop:main"
xinfer-profile = "xinfer.entrypoints.profile:main"

[tool.setuptools.packages.find]
include = ["xinfer*"]

[tool.setuptools.package-data]
xinfer = ["tuned/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA device",
    "assets: requires external model assets (see docs/models)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Markdown tables in the module docstrings
"xinfer/ops/backends/cuda/attn.py" = ["E501"]
