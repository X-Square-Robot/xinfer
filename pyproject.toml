[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name is provisional; see docs/design.md §22 (name conflict on PyPI).
name = "xinfer"
version = "0.0.1.dev0"
description = "Inference serving for vision-language-action models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.4",
    "safetensors>=0.4",
]

[project.optional-dependencies]
# Tokenization, image processing, and pose conversion for Wall-OSS and Wall-X 2B.
# Wall-X 2B on RPU shares the same stack (its CPU input pipeline needs transformers 5.2.0 and torchvision).
models = [
    "tokenizers>=0.19",
    "opencv-python-headless>=4.10",
    "pyyaml>=6",
    "numba>=0.60",
    "pillow>=10",
    "transformers==5.2.0",
    "torchvision>=0.25",
]
# image_preprocess_device = "gpu": JPEG decoding on CUDA devices with NVIDIA's nvImageCodec (CUDA 13 build).
gpu-image = [
    "nvidia-nvimgcodec-cu13>=0.10",
]
# The kernel libraries (xinfer/ops/backends/cuda/src and xinfer/ops/backends/ascend/src) are called through
# TVM-FFI; building them also needs CMake and their hardware toolchains (docs/kernels.md,
# xinfer/ops/backends/ascend/src/README.md).
kernels = [
    "apache-tvm-ffi>=0.1",
]
serve = [
    "websockets>=12",
    "msgpack>=1.0",
    "msgpack-numpy>=0.4.8",
    "prometheus_client>=0.20",
]
test = [
    "pytest>=7",
    "websockets>=12",
    # The RPU host tests compare banded cameras against Torchvision on CPU.
    "torchvision>=0.25",
    "prometheus_client>=0.20",
    "msgpack>=1.0",
    "msgpack-numpy>=0.4.8",
    "tokenizers>=0.19",
    "opencv-python-headless>=4.10",
    "pyyaml>=6",
    "numba>=0.60",
    "pillow>=10",
]

[project.scripts]
xinfer-serve = "xinfer.entrypoints.serve:main"
xinfer-profile = "xinfer.entrypoints.profile:main"

[tool.setuptools.packages.find]
include = ["xinfer*"]

[tool.setuptools.package-data]
xinfer = ["tuned/*/*.json", "ops/backends/cuda/xinfer_kernels.so", "ops/backends/ascend/xinfer_kernels_ascend.so",
          "ops/backends/ascend/src/third_party/tilelang/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA device",
    "assets: requires external model assets (see docs/models)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
# Keep the device generators and vendored native sources outside package linting.
extend-exclude = ["xinfer/ops/backends/ascend/src"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Markdown tables in the module docstrings
"xinfer/ops/backends/cuda/attn.py" = ["E501"]
# Preserve the existing CANN launch adapters' descriptor names and callable tables.
"xinfer/ops/backends/ascend/_cann_primitives.py" = ["E741"]
"xinfer/ops/backends/ascend/cann_projection.py" = ["E731"]
"xinfer/ops/backends/ascend/core.py" = ["F841"]
