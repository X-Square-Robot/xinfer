[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name is provisional; see docs/design.md §22 (name conflict on PyPI).
name = "xinfer"
version = "0.0.1.dev0"
description = "Inference serving for vision-language-action models"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.4",
    "safetensors>=0.4",
]

[project.optional-dependencies]
# Tokenization, image processing, and pose conversion for WALL-OSS-0.5 and WALL-OSS-1.0-Nano.
# WALL-OSS-1.0-Nano on RPU shares the same stack (its CPU input pipeline needs transformers 5.2.0 and torchvision).
models = [
    "tokenizers>=0.19",
    "opencv-python-headless>=4.10",
    "pyyaml>=6",
    "numba>=0.60",
    "pillow>=10",
    "transformers==5.2.0",
    "torchvision>=0.25",
]
# image_preprocess_device = "gpu": JPEG decoding on CUDA devices with NVIDIA's nvImageCodec (CUDA 13 build).
gpu-image = [
    "nvidia-nvimgcodec-cu13>=0.10",
]
# Native operator libraries use TVM-FFI. CUDA builds need CMake, the CUDA toolkit and CUTLASS (docs/kernels.md);
# RPU runtime builds need the external Rhino Launch SDK (docs/rpu_ops.md).
kernels = [
    "apache-tvm-ffi>=0.1",
]
serve = [
    "websockets>=12",
    "msgpack>=1.0",
    "msgpack-numpy>=0.4.8",
    "prometheus_client>=0.20",
]
test = [
    "pytest>=7",
    "websockets>=12",
    # The RPU host tests compare banded cameras against Torchvision on CPU.
    "torchvision>=0.25",
    "prometheus_client>=0.20",
    "msgpack>=1.0",
    "msgpack-numpy>=0.4.8",
    "tokenizers>=0.19",
    "opencv-python-headless>=4.10",
    "pyyaml>=6",
    "numba>=0.60",
    "pillow>=10",
]

[project.scripts]
xinfer-serve = "xinfer.entrypoints.serve:main"
xinfer-profile = "xinfer.entrypoints.profile:main"

[tool.setuptools.packages.find]
include = ["xinfer*"]
exclude = ["xinfer.ops.backends.rpu.src", "xinfer.ops.backends.rpu.src.*"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/LICENSE.rhinoforge", "licenses/NOTICE.rhinoforge"]

[tool.setuptools.exclude-package-data]
"xinfer.ops.backends.rpu" = ["src/*", "src/**/*"]

[tool.setuptools.package-data]
xinfer = ["tuned/*/*.json", "ops/backends/cuda/xinfer_kernels.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA device",
    "assets: requires external model assets (see docs/models)",
    "rpu: requires explicit opt-in and an RPU board, native runtime and external kernel assets",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Markdown tables in the module docstrings
"xinfer/ops/backends/cuda/attn.py" = ["E501"]
