# CPU checks on pull requests and main: ruff, repository content rules, and the test suite without a GPU
# (GPU and asset tests skip).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff==0.17.3
      - run: ruff check .

  repo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python tools/check_repo.py
      - run: python tools/docs_i18n.py check

  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[test,kernels]"
      - name: Build the RPU host resolver and contract tests
        run: |
          cmake -S xinfer/ops/backends/rpu/src -B build/rpu-host -DPython_EXECUTABLE="$(command -v python)"
          cmake --build build/rpu-host --parallel 2
          ctest --test-dir build/rpu-host --output-on-failure
      - run: pytest -q
        env:
          XINFER_RPU_LIBRARY: ${{ github.workspace }}/build/rpu-host/lib/xinfer_rpu.so
          XINFER_RPU_TEST_LIBRARY: ${{ github.workspace }}/build/rpu-host/lib/xinfer_rpu.so
