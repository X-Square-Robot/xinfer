# CPU checks on merge requests and main: ruff, repository content rules, and the test suite without a GPU
# (GPU and asset tests skip).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  image: python:3.10-slim
  tags: [build_runner_01]
  interruptible: true
  before_script:
    - python -m pip install --upgrade pip

variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

cache:
  key: pip
  paths: [.cache/pip]

ruff:
  script:
    - pip install ruff==0.17.3
    - ruff check .

repo-check:
  before_script: []
  script:
    - python tools/check_repo.py
    - python tools/docs_i18n.py check

cpu-tests:
  script:
    - pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
    - pip install -e ".[test]"
    - pytest -q
