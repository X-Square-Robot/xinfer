# Prometheus and Grafana for an xinfer-serve on this host (docs/metrics.md): docker compose up -d
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/xinfer.yaml:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/xinfer.yaml:ro
      - ./grafana/xinfer.json:/var/lib/grafana/dashboards/xinfer.json:ro
